[package]
name = "elastalert"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
iana-time-zone = "0.1.65"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "hostname", "rustls-native-certs"] }
log = "0.4.34"
mimalloc = "0.1.52"
minijinja = { version = "3.0.3", features = ["serde", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "process"] }
uuid = { version = "1.29.0", features = ["v7"] }

[profile.release]
lto = "fat"
codegen-units = 1
